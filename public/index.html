<header class="nav">
  <a class="brand" href="#next"><span class="mark" aria-hidden="true">特</span><span class="brand-name">我的特選紀錄</span><span class="brand-year" id="brand-year">116 學年度</span></a>
  <nav class="tabs" id="tabs" aria-label="畫面">
    <a href="#next" data-view="next">接下來</a>

  </div>
</header>

<main id="main">

</dialog>
